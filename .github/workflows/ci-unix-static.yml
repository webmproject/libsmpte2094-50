name: CI Unix Static
on: [push, pull_request]

permissions:
  contents: read

# Cancel the workflow if a new one is triggered from the same PR, branch, or tag, except on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-static:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build-type: [Release, Debug]
        include:
          - runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup-macos
        if: runner.os == 'macOS'

      - name: CMake
        run: >
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DBUILD_SHARED_LIBS=OFF
          -DSMPTE2094_ENABLE_TESTS=ON -DSMPTE2094_ENABLE_WERROR=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} --parallel
      - name: Run Tests
        working-directory: ./build
        run: ctest --parallel --output-on-failure
